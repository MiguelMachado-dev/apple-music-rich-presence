name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build AppleMusicPresence.sln -c Release
      - name: Behavioral and RPC tests
        run: dotnet run --project tests/AppleMusicPresence.Specs -c Release --no-build
      - name: Publish portable executable
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AppleMusicPresence-win-x64
          path: out/AppleMusicPresence-win-x64/
          if-no-files-found: error
